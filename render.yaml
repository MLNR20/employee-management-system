# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard -> New -> Blueprint -> pick this repo. Render prompts for every `sync: false` value.
# MongoDB is not hosted by Render: use MongoDB Atlas and paste its connection string as MONGO_URI.
services:
  # Express API
  - type: web
    name: ems-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /health # Render only routes traffic to a new deploy once this returns 200
    envVars:
      - key: NODE_VERSION # process.loadEnvFile needs Node 20.12+
        value: 22
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: EMPLOYEE_JWT_SECRET
        generateValue: true
      # Browser origins allowed to call the API (comma-separated). Must match the public URL of ems-client.
      - key: CORS_ORIGINS
        value: https://ems-client-f6s8.onrender.com
      # Render puts one reverse proxy in front of the API; rate limiting needs it to see each client's real IP.
      - key: TRUST_PROXY
        value: 1
      # First administrator, created on a fresh database (see ensureAdministratorsExist).
      - key: USERNAME
        sync: false
      - key: PASSWORD
        sync: false
      - key: FIRST_NAME
        sync: false
      - key: LAST_NAME
        sync: false
      - key: EMAIL
        sync: false

  # React (Create React App) single-page app
  - type: web
    name: ems-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: 22
      # CRA inlines this at build time. Must be the public URL of ems-api (no trailing slash);
      # if Render gave the API a different hostname, change it and redeploy the client.
      - key: REACT_APP_API_URL
        value: https://ems-api-uqww.onrender.com
      - key: CI # stop CRA from failing the build on lint warnings
        value: "false"
    routes:
      # Client-side routing: serve index.html for every path that is not a real file.
      - type: rewrite
        source: /*
        destination: /index.html
